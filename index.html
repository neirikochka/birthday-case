<!DOCTYPE html>
<html lang="ru">
<head>

<body>
  <div id="app">
    <header>
      <span><span class="status-dot"></span>АРХИВ НЕИЗВЕСТНЫХ СОБЫТИЙ</span>
      <span id="headerCase">ДЕЛО № 001</span>
      <button id="restartBtn" type="button">↺ Начать сначала</button>
    </header>
    <main id="main"></main>
    <footer>
      <span>СИСТЕМА ВОССТАНОВЛЕНИЯ СОБЫТИЙ</span>
      <span id="footerStatus">СОЕДИНЕНИЕ УСТАНОВЛЕНО</span>
    </footer>
  </div>

  <script>
    const STORAGE_KEY = "birthdayCaseProgress_v1";

    const defaultState = {
      stage: "intro",
      name: "",
      introStarted: false,
      trace01Done: false,
      fragment01: [],
      dialogueIndex: 0,
      errorCount: 0
    };

    let state = loadState();

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return saved ? { ...defaultState, ...saved } : { ...defaultState };
      } catch (error) {
        return { ...defaultState };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    const main = document.getElementById("main");
    document.getElementById("restartBtn").addEventListener("click", () => {
  if (window.confirm("Начать историю заново? Сохранённый прогресс будет удалён.")) {
    localStorage.removeItem(STORAGE_KEY);
    state = { ...defaultState };
    setTheme("");
    render();
  }
});

    function setStage(stage) {
  const main = document.getElementById("main");

  main.classList.add("stage-leaving");

  setTimeout(() => {
    state.stage = stage;
    saveState();
    render();

    main.classList.remove("stage-leaving");
  }, 250);
}

    function setTheme(theme) {
      document.body.classList.remove("warm", "map-mode", "room-mode");
      if (theme) document.body.classList.add(theme);
    }

    function setFooter(text) {
      document.getElementById("footerStatus").textContent = text;
    }

    function render() {
      setTheme("");
      document.getElementById("headerCase").textContent = "ДЕЛО № 001";

      switch (state.stage) {
        case "intro": renderIntro(); break;
        case "retry": renderRetry(); break;
        case "search": renderSearch(); break;
        case "identity": renderIdentity(); break;
        case "case01_restore": renderRestore(); break;
        case "case01_silhouettes": renderSilhouettes(); break;
        case "case01_map": renderMap(); break;
        case "case01_room": renderRoom(); break;
        case "case01_dialogue": state.stage = "case01_room"; saveState(); renderRoom(); break;
        case "case01_puzzle": renderPuzzle(); break;
        case "case01_fragment": renderFragment(); break;
        case "case01_done": renderDone(); break;
        case "case02_locked": renderAaronIntro(); break;
        case "case02_intro": renderAaronIntro(); break;
        case "case02_dialogue": renderAaronDialogue(); break;
        case "case02_puzzle": renderAaronPuzzle(); break;
        case "case02_fragment": renderAaronFragment(); break;
                case "case02_done": renderAaronDone(); break;
        
        case "case03_locked": renderLocked(); break;
        case "case03_dialogue": renderJamesDialogue(); break;
        case "case03_puzzle": renderJamesPuzzle(); break;
        case "case03_fragment": renderJamesFragment(); break;
        case "case03_reveal": renderJamesReveal(); break;
        case "case03_done": renderJamesDone(); break;
        case "case04_intro": renderRudyYanIntro(); break;
        case "case04_dialogue": renderRudyYanDialogue(); break;
        case "case04_book": renderRudyYanBook(); break;
        case "case04_fragment": renderRudyYanFragment(); break;
                case "case04_done": renderRudyYanDone(); break;
                case "final_code": renderFinalCode(); break;
        case "final_intro": renderFinalIntro(); break;
        case "final_characters": renderFinalCharacters(); break;
        case "final_letter": renderFinalLetter(); break;
        case "final_end": renderFinalEnd(); break;
        default:
          state.stage = "intro";
          saveState();
          renderIntro();
      }
    }

   
function renderIntro() {

}, 2800);

function renderRetry() {

function renderSearch() {
  setFooter("ПОИСК СОБЫТИЯ");

  const lines = [
    ["08%", "Сканирование архива..."],
    ["23%", "Поиск совпадений..."],
    ["41%", "Анализ неизвестных данных..."],
    ["67%", "Необычно большое количество данных."],
    ["94%", "Почти готово..."],
    ["99%", "Почему их четыре?"],
    ["100%", "ПРАЗДНИК ОБНАРУЖЕН."]
  ];

  let index = 0;

  main.innerHTML = `
    <section class="screen terminal-flicker">
      <div class="eyebrow">ПОИСК СОБЫТИЯ</div>
      <h2 id="searchTitle">Подключение к архиву...</h2>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <p class="muted" id="progressPercent">00%</p>
      <div class="console" id="searchConsole"></div>

      <div class="actions">
        <button class="primary" id="continueSearch" hidden>
          [ ПРОДОЛЖИТЬ ]
        </button>
      </div>
    </section>`;

  const fill = document.getElementById("progressFill");
  const title = document.getElementById("searchTitle");
  const percent = document.getElementById("progressPercent");
  const consoleBox = document.getElementById("searchConsole");
  const next = document.getElementById("continueSearch");

  fill.style.width = "0%";

  function step() {
    const item = lines[index];

    title.textContent = item[1];
    percent.textContent = item[0];

    const p = document.createElement("p");
    p.textContent = item[1];
    p.style.opacity = "0";
    p.style.transition = "opacity 0.45s ease";

    if (item[1].includes("Почему")) {
      p.className = "gold";
      title.classList.add("system-glitch");
      percent.classList.add("red");
    } else {
      title.classList.remove("system-glitch");
      percent.classList.remove("red");
    }

    consoleBox.appendChild(p);

    requestAnimationFrame(() => {
      p.style.opacity = "1";
    });

    fill.style.width = item[0];

    index++;

    if (index < lines.length) {
      let delay = 1100;

      if (item[0] === "99%") {
        delay = 2600;
      }

      if (item[0] === "100%") {
        delay = 1500;
      }

      window.setTimeout(step, delay);
    } else {
      next.hidden = false;
      next.style.opacity = "0";
      next.style.transition = "opacity 0.5s ease";

      requestAnimationFrame(() => {
        next.style.opacity = "1";
      });

      next.onclick = () => setStage("identity");
    }
  }

  window.setTimeout(step, 700);
}

function advanceDialogue() {
  if (!Number.isInteger(state.dialogueIndex) ||
      state.dialogueIndex < 0 ||
      state.dialogueIndex >= dialogue.length) {
    state.dialogueIndex = 0;
    saveState();
    updateDialogue();
    return;
  }

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

      <div class="actions">
        <button class="primary" id="replayBirthday">
          [ ПЕРЕЖИТЬ ЗАНОВО ]
        </button>
      </div>
    </section>`;

  document.getElementById("replayBirthday").onclick = () => {
    const confirmed = confirm(
      "Начать заново? Сохранённый прогресс будет сброшен."
    );

    if (confirmed) {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  };
}

    // Возвращаемся к сохранённому этапу, а не начинаем всё сначала.
    render();
  </script>
</body>
</html>
